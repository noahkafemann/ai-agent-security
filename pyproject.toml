[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agoris"
version = "0.1.0"
description = "Eine sichere Umgebung fuer unzuverlaessige KI-Agenten"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Noah Kafemann"}]
keywords = ["sandbox", "security", "ki", "agent", "linux", "namespaces", "seccomp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security",
]

[project.scripts]
agoris = "agoris.cli:main"

[tool.setuptools]
packages = ["agoris"]
