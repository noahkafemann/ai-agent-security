name: Website veröffentlichen

# Veröffentlicht die Seite aus website/ auf GitHub Pages.
# Voraussetzung im Repository: Settings → Pages → Source: "GitHub Actions"
# Ergebnis: https://noahkafemann.github.io/ai-agent-security/

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "tools/**"
      - "agoris/**"
      - "agoris.py"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Seite zusammenstellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inhalt für die Veröffentlichung sammeln
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/docs

          # Die Seite selbst
          cp -a website/. _site/

          # Die Dokumentation als HTML. Ohne diesen Schritt liefert Pages die
          # .md-Dateien als reinen Text aus - man klickt auf einen Link und
          # sieht eine Wand aus Sternchen und Pipe-Zeichen.
          python3 tools/md2html.py docs/*.md -o _site/docs

          # Übersichtsseite für die Doku
          python3 - <<'PY'
          import os
          eintraege = [
              ("ARCHITEKTUR.html", "Architektur",
               "Die sieben Schichten im Detail, die Reihenfolge und warum sie nicht "
               "verhandelbar ist - dazu die Fehler, die beim Bauen passiert sind."),
              ("VERSUCHSPROTOKOLL.html", "Versuchsprotokoll",
               "Wie gemessen wurde, welche Werte herauskamen und welche Grenzen "
               "diese Messung hat."),
              ("ANWENDUNG.html", "Anwendung",
               "Policies schreiben, eigene Werkzeuge ergaenzen, Auswertungen "
               "selbst auswerten."),
          ]
          karten = "\n".join(
              f'      <li><a href="{datei}"><b>{titel}</b></a><span>{text}</span></li>'
              for datei, titel, text in eintraege
          )
          open("_site/docs/index.html", "w", encoding="utf-8").write(f"""<!DOCTYPE html>
          <html lang="de"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>AGORIS &ndash; Dokumentation</title>
          <link rel="stylesheet" href="doku-style.css">
          <style>body{{padding-top:56px}}h1{{margin-bottom:.2em}}
          ul{{list-style:none;padding:0}}
          li{{background:#0b111c;border:1px solid #172232;border-radius:12px;
             padding:20px 22px;margin:0 0 14px}}
          a{{text-decoration:none;display:block}}
          b{{font-size:1.15rem;color:#dce6f2}}
          span{{display:block;margin-top:6px;font-size:14px}}</style>
          </head><body><article>
          <h1>Dokumentation</h1>
          <p>Drei Dokumente zum Projekt. Alle Messwerte daraus sind auf einem
          echten Rechner entstanden, nicht geschaetzt.</p>
          <ul>
          {karten}
          </ul>
          </article>
          <footer><a href="../index.html">&larr; zur&shy;ck zur AGORIS-Seite</a></footer>
          </body></html>
          """)
          PY

          touch _site/.nojekyll

          echo "--- Inhalt von _site ---"
          find _site -type f | sort
          echo "--- Umfang: $(du -sh _site | cut -f1) ---"

      - name: Prüfen, dass die Seite nichts von außen nachlädt
        run: |
          set -euo pipefail
          # Die Seite soll offline und ohne CDN funktionieren. Deshalb darf sie
          # keine *Ressourcen* nachladen. Verweise auf andere Seiten (href auf
          # github.com) sind erlaubt - die klickt man ja absichtlich an.
          fehler=0
          if grep -rnE '<(img|script|iframe|video|audio|source)[^>]*src="(https?:)?//' _site/*.html; then
            fehler=1
          fi
          if grep -rnE '<link[^>]*href="(https?:)?//' _site/*.html _site/docs/*.html; then
            fehler=1
          fi
          if grep -nE '@import|url\((https?:)?//' _site/*.css; then
            fehler=1
          fi
          if [ "$fehler" -ne 0 ]; then
            echo "FEHLER: Die Seite laedt Ressourcen aus dem Internet nach."
            echo "       Sie soll vollstaendig offline funktionieren."
            exit 1
          fi
          echo "OK: alle Ressourcen liegen im Repository"

      - name: Prüfen, dass die Dokumentation wirklich HTML ist
        run: |
          set -euo pipefail
          # Wenn die Umwandlung fehlschlaegt, darf nicht ungemerkterweise eine
          # rohe Markdown-Datei ausgeliefert werden.
          for datei in ARCHITEKTUR VERSUCHSPROTOKOLL ANWENDUNG; do
            if [ ! -s "_site/docs/$datei.html" ]; then
              echo "FEHLER: _site/docs/$datei.html fehlt oder ist leer."
              exit 1
            fi
          done
          # Kein rohes Markdown mehr ausliefern
          rm -f _site/docs/*.md
          echo "OK: Doku liegt als HTML vor"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Auf GitHub Pages ausspielen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Freigeben
        id: deployment
        uses: actions/deploy-pages@v4