name: Website veröffentlichen

# Veröffentlicht die Seite aus website/ auf GitHub Pages.
# Voraussetzung im Repository: Settings → Pages → Source: "GitHub Actions"
# Ergebnis: https://noahkafemann.github.io/ai-agent-security/

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "tools/**"
      - "agoris/**"
      - "agoris.py"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Seite zusammenstellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Werkzeuge prüfen
        # Erst die Werkzeuge, dann ihr Ergebnis benutzen. Ein Fehler hier
        # bedeutet, dass die Seite stillschweigend kaputt wäre.
        run: python3 tools/selbsttest.py

      - name: Inhalt für die Veröffentlichung sammeln
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/docs

          # Die Seite selbst
          cp -a website/. _site/

          # Die Dokumentation als HTML. Ohne diesen Schritt liefert Pages die
          # .md-Dateien als reinen Text aus - man klickt auf einen Link und
          # sieht eine Wand aus Sternchen und Pipe-Zeichen.
          python3 tools/md2html.py docs/*.md -o _site/docs

          touch _site/.nojekyll

          echo "--- Inhalt von _site ---"
          find _site -type f | sort
          echo "--- Umfang: $(du -sh _site | cut -f1) ---"

      - name: Rohes Markdown entfernen
        run: |
          set -euo pipefail
          # Wenn die Umwandlung fehlschlaegt, darf nicht ungemerkterweise eine
          # rohe Markdown-Datei ausgeliefert werden.
          for datei in ARCHITEKTUR VERSUCHSPROTOKOLL ANWENDUNG; do
            if [ ! -s "_site/docs/$datei.html" ]; then
              echo "FEHLER: _site/docs/$datei.html fehlt oder ist leer."
              exit 1
            fi
          done
          rm -f _site/docs/*.md

      - name: Seite prüfen
        run: python3 tools/check_links.py _site

      - name: Eingecheckte Dokumentation prüfen
        # Die HTML-Kopie unter website/docs/ muss zu docs/*.md passen. Sonst
        # zeigt die Seite aus dem Repository etwas anderes als die veroeffent-
        #lichte. Erst an dieser Stelle auffallen - nicht erst bei einem Leser.
        run: python3 tools/check_links.py website --mit-doku-drift

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Auf GitHub Pages ausspielen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Freigeben
        id: deployment
        uses: actions/deploy-pages@v4